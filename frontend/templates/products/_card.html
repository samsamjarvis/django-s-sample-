{% load humanize %}
<article class="product-card">
    <a href="{{ product.get_absolute_url }}" class="product-card__media">
        {% if product.main_image %}
            <img src="{{ product.main_image.image.url }}" alt="{{ product.name }}" loading="lazy">
        {% else %}
            <div style="width:100%;height:100%;display:grid;place-items:center;font-size:3rem;opacity:.3">💎</div>
        {% endif %}
        {% if product.is_discounted %}<span class="product-card__badge">{{ product.discount_percent }}٪</span>{% endif %}
    </a>
    <div class="product-card__body">
        <a href="{{ product.get_absolute_url }}"><h3 class="product-card__title">{{ product.name }}</h3></a>
        <div class="product-card__price">
            <span class="price-current">{{ product.final_price|intcomma }} تومان</span>
            {% if product.is_discounted %}<span class="price-old">{{ product.price|intcomma }}</span>{% endif %}
        </div>
        <form method="post" action="{% url 'cart:add' %}">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="product-card__btn">افزودن به سبد</button>
        </form>
    </div>
</article>
