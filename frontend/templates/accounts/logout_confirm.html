{% extends "base.html" %}
{% block title %}خروج — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align:center">
        <h1 class="auth-title">خروج از حساب</h1>
        <p class="auth-subtitle">آیا مطمئن هستید؟</p>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:flex;gap:12px">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-block">بله، خروج</button>
            <a href="{% url 'core:home' %}" class="btn btn-outline btn-block">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
