{% extends "base.html" %}
{% block title %}حذف آدرس — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align:center">
        <h1 class="auth-title">حذف آدرس</h1>
        <p class="auth-subtitle">آیا از حذف این آدرس مطمئن هستید؟</p>
        <form method="post" style="display:flex;gap:12px">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-block">حذف</button>
            <a href="{% url 'customers:address_list' %}" class="btn btn-outline btn-block">انصراف</a>
        </form>
    </div>
</div>
{% endblock %}
